  #rotate{display:none;position:absolute;top:max(14px,env(safe-area-inset-top));left:0;right:0;text-align:center;
    font:10px "Press Start 2P",monospace;color:#cfe0ff;line-height:1.6}
  @media (orientation:portrait){ body.mobile #rotate{display:block} }

<script>
"use strict";
// =====================================================================
//  SUPER ZAMAN BROS.  — a 2-level Yale SOM platformer
//  Controls: Arrows / WASD move · Space / Z / Up jump · Shift / X run
//            P pause · M mute · Enter select
//  Optional: drop square headshots into ./faces/ named zaman.png,
//            obama.png, socrates.png and they will be used as the heads.
// =====================================================================
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 960, H = 540, T = 36, ROWS = 15;
const FONT = '"Press Start 2P", "Courier New", monospace';

// ---------------------------------------------------------------- input
const keys = {}, pressed = {};
addEventListener('keydown', e => {
  if (!keys[e.code]) pressed[e.code] = true;
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  audio.unlock();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
// Touch controls feed the same keys/pressed tables using virtual "Touch*" codes.
const JUMP_KEYS = ['Space','KeyZ','ArrowUp','KeyW','TouchJump'];
const K = {
  left:  () => keys.ArrowLeft || keys.KeyA || keys.TouchLeft,
  right: () => keys.ArrowRight || keys.KeyD || keys.TouchRight,
  jump:  () => JUMP_KEYS.some(k => keys[k]),
  run:   () => keys.ShiftLeft || keys.ShiftRight || keys.KeyX || keys.TouchRun || keys.TouchDash,
};
const hit = (...codes) => codes.some(c => pressed[c]);

// ---------------------------------------------------------------- audio
const audio = {
  ctx: null, master: null, muted: false,
  unlock() {
    if (!this.ctx) {
      try {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.master = this.ctx.createGain(); this.master.gain.value = 0.22;
        this.master.connect(this.ctx.destination);
      } catch (e) { return; }
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(freq, dur, type = 'square', vol = 0.3, slideTo = null, delay = 0) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime + Math.max(0, delay);
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.02);
  }
};
const seq = (notes, step, type = 'square', vol = 0.18) =>
  notes.forEach((f, i) => f && audio.tone(f, step * 1.1, type, vol, null, i * step));
const sfx = {
  jump:   () => audio.tone(280, 0.18, 'square', 0.18, 720),
  card:   () => { audio.tone(988, 0.07, 'square', 0.18); audio.tone(1319, 0.3, 'square', 0.18, null, 0.07); },
  stomp:  () => audio.tone(420, 0.12, 'square', 0.25, 110),
  kick:   () => audio.tone(760, 0.09, 'square', 0.2, 300),
  bump:   () => audio.tone(160, 0.09, 'triangle', 0.45, 90),
  brk:    () => { audio.tone(220, 0.2, 'sawtooth', 0.2, 60); audio.tone(130, 0.22, 'square', 0.15, 50, 0.03); },
  sprout: () => seq([200, 280, 360, 440, 520, 600], 0.05, 'square', 0.15),
  power:  () => seq([523, 659, 784, 1047, 784, 1047, 1319], 0.06),
  hurt:   () => seq([660, 494, 330, 247], 0.08),
  die:    () => seq([784, 740, 698, 0, 523, 494, 392, 0, 262], 0.15),
  oneup:  () => seq([659, 784, 1319, 1047, 1175, 1568], 0.08),
  flag:   () => seq([392, 440, 494, 523, 587, 659, 698, 784, 880, 988, 1047], 0.05, 'square', 0.14),
  clear:  () => seq([523, 659, 784, 1047, 0, 784, 1047, 0, 1319], 0.14, 'square', 0.2),
  tick:   () => audio.tone(1500, 0.03, 'square', 0.07),
  pause:  () => seq([988, 784, 988, 784], 0.06, 'square', 0.12),
};
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
const SONGS = [
  { bpm: 150,   // level 1: bright and bouncy (original tune)
    mel:  [72,0,76,79, 0,76,72,0, 74,0,77,81, 0,77,74,0, 76,79,84,0, 83,81,79,0, 77,76,74,72, 74,0,79,0,
           72,0,76,79, 0,76,72,0, 74,0,77,81, 0,84,83,81, 79,0,77,76, 74,0,76,74, 72,0,0,0, 67,69,71,0],
    bass: [48,0,55,0, 48,0,55,0, 50,0,57,0, 50,0,57,0, 52,0,55,0, 53,0,57,0, 55,0,55,0, 43,0,47,0] },
  { bpm: 132,   // level 2: mysterious library at night
    mel:  [69,0,72,0,76,0,74,72, 71,0,74,0,77,0,76,74, 72,0,76,0,81,0,79,77, 76,74,72,71,69,0,64,0,
           69,0,72,76,0,74,72,71, 72,0,74,0,76,0,77,0, 76,0,74,0,72,0,71,0, 69,0,0,0,0,0,68,0],
    bass: [45,0,52,0,45,0,52,0, 43,0,50,0,43,0,50,0, 41,0,48,0,41,0,48,0, 40,0,47,0,45,0,40,0] },
];
const music = {
  timer: null, step: 0, next: 0, song: null,
  start(song) {
    this.stop(); if (!audio.ctx) return;
    this.song = song; this.step = 0; this.next = audio.ctx.currentTime + 0.05;
    this.timer = setInterval(() => this.tick(), 40);
  },
  stop() { clearInterval(this.timer); this.timer = null; },
  tick() {
    const s = this.song, dt = 60 / s.bpm / 2;
    while (this.next < audio.ctx.currentTime + 0.15) {
      const off = this.next - audio.ctx.currentTime;
      const m = s.mel[this.step % s.mel.length], b = s.bass[this.step % s.bass.length];
      if (m) audio.tone(midi(m), dt * 0.85, 'square', 0.07, null, off);
      if (b) audio.tone(midi(b), dt * 0.9, 'triangle', 0.2, null, off);
      this.next += dt; this.step++;
    }
  }
};

// ---------------------------------------------------------------- characters
const CHARS = [
  { id: 'zaman', name: 'PROF. ZAMAN', desc: 'BALANCED OPTIMIZER', walk: 3.2, run: 5.6, jump: 13.2,
    skin: '#a8714a', hair: '#141414', suit: '#1b2b52', shirt: '#d8e8ff', tie: '#00356b', pants: '#2a3142', shoes: '#111111', brow: '#141414' },
  { id: 'obama', name: 'PRES. OBAMA', desc: 'FASTEST. YES HE CAN!', walk: 3.5, run: 6.3, jump: 12.6,
    skin: '#6e4327', hair: '#262626', suit: '#2a2b30', shirt: '#ffffff', tie: '#2a5db0', pants: '#2a2b30', shoes: '#0d0d0d', brow: '#1a1a1a' },
  { id: 'socrates', name: 'SOCRATES', desc: 'HIGHEST JUMP. KNOWS NOTHING', walk: 3.0, run: 5.2, jump: 14.4,
    skin: '#d6a47a', hair: '#ececec', suit: '#f3efe4', trim: '#5b7fbf', pants: '#d6a47a', shoes: '#7a4a1f', brow: '#e0e0e0' },
  { id: 'bush', name: 'PRES. BUSH', desc: 'STEADY, STRONG RUNNER', walk: 3.4, run: 6.0, jump: 13.0,
    skin: '#e3b393', hair: '#a9a9a9', suit: '#1f2430', shirt: '#ffffff', tie: '#3d6fb6', pants: '#1f2430', shoes: '#0d0d0d', brow: '#8a8a8a' },
];
const faces = {};
for (const c of CHARS) {
  const im = new Image();
  im.onerror = () => { faces[c.id] = null; };
  im.src = 'faces/' + c.id + '.png';
  faces[c.id] = im;
}

// ---------------------------------------------------------------- themes
const THEMES = {
  day: { skyTop: '#4f9cf0', skyBot: '#d4ecff', far: '#a3c3e2', farWin: '#86a8cb', ground: '#c7a46c', groundDark: '#8f6d3d',
         groundLight: '#dcbf8a', grass: '#5bb04f', grassDark: '#3d8a3a', brick: '#b4472e', brickLine: '#5e1f12', brickHi: '#d8735a',
         hard: '#a89f92', hardLight: '#d6cfc3', hardDark: '#6e665b', pit: '#25344d', stone: '#cbbfa5', stoneDark: '#968a72',
         near1: '#4c9a52', near2: '#3a7f42' },
  night: { skyTop: '#040818', skyBot: '#25335c', far: '#161f3d', farWin: '#26315a', ground: '#857a6a', groundDark: '#4e463c',
         groundLight: '#a39783', grass: '#2f5e3c', grassDark: '#1d3d27', brick: '#7b3326', brickLine: '#33130c', brickHi: '#a1574a',
         hard: '#77706a', hardLight: '#a19a92', hardDark: '#48433f', pit: '#02040b', stone: '#7d7466', stoneDark: '#514a40',
         near1: '#13241a', near2: '#0c1912' },
};

// ---------------------------------------------------------------- helpers
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = n >> 8 & 255, b = n & 255;
  const f = amt < 0 ? 0 : 255, p = Math.abs(amt);
  r = Math.round(r + (f - r) * p); g = Math.round(g + (f - g) * p); b = Math.round(b + (f - b) * p);
  return `rgb(${r},${g},${b})`;
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function ellipse(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), 0, 0, Math.PI * 2); ctx.fill(); }
function tri(x, yb, w, h) { ctx.beginPath(); ctx.moveTo(x, yb); ctx.lineTo(x + w, yb); ctx.lineTo(x + w / 2, yb - h); ctx.closePath(); ctx.fill(); }
function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function limb(x1, y1, x2, y2, w, col) { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round'; line(x1, y1, x2, y2); }
function text(s, x, y, size, color = '#fff', align = 'left', shadow = true) {
  ctx.font = `${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'top';
  if (shadow) { ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillText(s, x + Math.max(2, size / 7), y + Math.max(2, size / 7)); }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
const overlap = (a, b, s = 0) => a.x + s < b.x + b.w && a.x + a.w - s > b.x && a.y + s < b.y + b.h && a.y + a.h - s > b.y;
const pad = (n, l) => String(n).padStart(l, '0');

// ---------------------------------------------------------------- level building
function newLevel(w, theme, name, world, sign) {
  const grid = []; for (let y = 0; y < ROWS; y++) grid.push(new Array(w).fill(0));
  return { w, grid, ents: [], theme, name, world, sign, start: 3, mid: Math.floor(w / 2), flagX: 0, castleX: 0 };
}
// tiles: 1 ground, 2 brick, 3 ?-block (ID card), 4 ?-block (soda), 5 used, 6 stone, 7/8 pipe (left/right)
const LB = {
  ground(L, a, b) { for (let x = a; x <= b; x++) { L.grid[13][x] = 1; L.grid[14][x] = 1; } },
  row(L, x, y, s) { for (let i = 0; i < s.length; i++) { const v = { B: 2, '?': 3, S: 4, X: 6 }[s[i]]; if (v) L.grid[y][x + i] = v; } },
  pipe(L, x, h) { for (let y = 13 - h; y <= 12; y++) { L.grid[y][x] = 7; L.grid[y][x + 1] = 8; } },
  stairsUp(L, x, n) { for (let i = 0; i < n; i++) for (let k = 0; k <= i; k++) L.grid[12 - k][x + i] = 6; },
  stairsDown(L, x, n) { for (let i = 0; i < n; i++) for (let k = 0; k < n - i; k++) L.grid[12 - k][x + i] = 6; },
  col(L, x, h) { for (let k = 0; k < h; k++) L.grid[12 - k][x] = 6; },
  cards(L, x, y, n) { for (let i = 0; i < n; i++) L.ents.push({ kind: 'card', tx: x + i, ty: y }); },
  arc(L, x, y, n) { for (let i = 0; i < n; i++) L.ents.push({ kind: 'card', tx: x + i, ty: y - Math.round(Math.sin(i / (n - 1) * Math.PI) * 2) }); },
  enemy(L, x, kind = 'book', row = 12) { L.ents.push({ kind, tx: x, ty: row }); },
  plat(L, x, y, wT, a, b) { L.ents.push({ kind: 'plat', tx: x, ty: y, wT, a, b }); },
  flag(L, x) { L.flagX = x; L.castleX = x + 5; },
};

  LB.row(L, 22, 5, '?');

  LB.pipe(L, 28, 2); LB.arc(L, 31, 9, 5); LB.pipe(L, 38, 3); LB.pipe(L, 46, 3); LB.pipe(L, 57, 3);
  LB.enemy(L, 41); LB.enemy(L, 51); LB.enemy(L, 53);
  LB.cards(L, 61, 8, 4);
  LB.row(L, 64, 9, 'B?B');

  LB.row(L, 106, 9, '?'); LB.row(L, 109, 9, '?'); LB.row(L, 109, 5, 'S'); LB.row(L, 112, 9, '?');
  LB.enemy(L, 107, 'heavy');
  LB.row(L, 118, 9, 'B'); LB.row(L, 121, 5, 'BBB'); LB.cards(L, 121, 4, 3);

  LB.row(L, 128, 5, 'B??B'); LB.row(L, 129, 9, 'BB');
  LB.enemy(L, 124); LB.enemy(L, 126);
  LB.stairsUp(L, 134, 4); LB.stairsDown(L, 140, 4);
  LB.stairsUp(L, 146, 4); LB.col(L, 150, 4); LB.stairsDown(L, 153, 4);
  LB.pipe(L, 163, 2);

const LEVELS = [level1, level2];

// ---------------------------------------------------------------- entities
const BOOKS = [['#b3261e', 'ECON'], ['#2e7d32', 'STATS'], ['#6a1b9a', 'DATA'], ['#1565c0', 'CALC'], ['#ef6c00', 'ACCT'], ['#00695c', 'OPS']];
function spawn(s, i) {
  switch (s.kind) {
    case 'book': { const b = BOOKS[i % BOOKS.length];
      return { kind: 'book', x: s.tx * T + 3, y: (s.ty + 1) * T - 28, w: 30, h: 28, vx: -1, vy: 0, state: 'walk', phase: i, color: b[0], title: b[1], active: false, t: 0 }; }
    case 'heavy':
      return { kind: 'heavy', x: s.tx * T + 2, y: (s.ty + 1) * T - 40, w: 32, h: 40, vx: -0.9, vy: 0, state: 'walk', phase: i, color: '#4a2c20', title: 'OPS RES', active: false, t: 0, grace: 0 };
    case 'card':

    case 'plat':

const isEnemy = e => e.kind === 'book' || e.kind === 'heavy';
const ENEMY_LIVE = ['walk', 'shell', 'slide'];

// ---------------------------------------------------------------- game state
const IS_TOUCH = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
const G = { state: 'device', mobile: false,
  devSel: localStorage.getItem('szb_dev') ? +(localStorage.getItem('szb_dev') === 'mobile') : +IS_TOUCH, sel: 0, charIdx: 0, lives: 3, score: 0, cards: 0, totalCards: 0, levelIdx: 0, time: 300, timeAcc: 0,
  frame: 0, timer: 0, freeze: 0, growT: 0, paused: false, checkpoint: false, carryBig: false, ents: [], parts: [], bumps: [],
  camX: 0, flagY: 0, hi: +(localStorage.getItem('szb_hi') || 0) };
G.titleBg = makeBg({ w: 4000, theme: 'day', world: 'T' });

function makePlayer(x, big) {
  const h = big ? 62 : 32;
  return { x, y: 13 * T - h, w: 24, h, vx: 0, vy: 0, big, facing: 1, onGround: true, phase: 0, inv: 0, coyote: 0, jumpBuf: 0,
    riding: null, dead: false, hidden: false, combo: 0, prevBottom: 0 };
}

function makeBg(L) {
  const r = rng(L.world === '1-2' ? 1312 : 2024);
  const far = [], near = [], clouds = [], stars = [];
  const farSpan = L.w * T * 0.25 + W + 200, nearSpan = L.w * T * 0.55 + W + 200;
  for (let x = -60; x < farSpan;) {
    const p = r(), type = p < 0.3 ? 'tower' : p < 0.7 ? 'hall' : 'chapel';
    const w = type === 'tower' ? 46 + r() * 26 : type === 'hall' ? 120 + r() * 110 : 70 + r() * 40;
    const h = type === 'tower' ? 170 + r() * 90 : type === 'hall' ? 70 + r() * 60 : 90 + r() * 50;
    far.push({ x, w, h, type, seed: Math.floor(r() * 1e6) }); x += w + 10 + r() * 50;
  }
  for (let x = 0; x < nearSpan;) { near.push({ x, s: 0.7 + r() * 0.6, k: r() }); x += 70 + r() * 160; }
  for (let i = 0; i < L.w / 5; i++) clouds.push({ x: r() * (L.w * T * 0.4 + W), y: 25 + r() * 150, s: 0.6 + r() * 0.8 });
  for (let i = 0; i < 140; i++) stars.push({ x: r() * W, y: r() * 330, s: r() < 0.15 ? 2 : 1, p: r() * 6 });

}

function startGame() {

  startIntro();
}
function startIntro() { loadLevel(); G.state = 'intro'; G.timer = 0; }
function loadLevel() {
  const L = G.lvl = LEVELS[G.levelIdx]();
  G.ents = L.ents.map(spawn); G.parts = []; G.bumps = [];
  const sx = (G.checkpoint ? L.mid : L.start) * T + 6;
  G.player = makePlayer(sx, G.carryBig);
  G.time = 300; G.timeAcc = 0; G.freeze = 0; G.growT = 0; G.paused = false;
  G.camX = clamp(sx - W * 0.42, 0, L.w * T - W);

// ---------------------------------------------------------------- physics
function solidAt(tx, ty) {
  const L = G.lvl;
  if (tx < 0 || tx >= L.w) return true;
  if (ty < 0 || ty >= ROWS) return false;
  return L.grid[ty][tx] > 0;
}
function moveEntity(o) {
  const r = { left: false, right: false, top: false, bottom: false, headTiles: [], headRow: 0 };
  o.x += o.vx;
  const y0 = Math.floor(o.y / T), y1 = Math.floor((o.y + o.h - 0.01) / T);
  if (o.vx > 0) { const tx = Math.floor((o.x + o.w - 0.01) / T);
    for (let ty = y0; ty <= y1; ty++) if (solidAt(tx, ty)) { o.x = tx * T - o.w; r.right = true; break; } }
  else if (o.vx < 0) { const tx = Math.floor(o.x / T);
    for (let ty = y0; ty <= y1; ty++) if (solidAt(tx, ty)) { o.x = (tx + 1) * T; r.left = true; break; } }
  o.y += o.vy;
  const x0 = Math.floor(o.x / T), x1 = Math.floor((o.x + o.w - 0.01) / T);
  if (o.vy > 0) { const ty = Math.floor((o.y + o.h - 0.01) / T);
    for (let tx = x0; tx <= x1; tx++) if (solidAt(tx, ty)) { o.y = ty * T - o.h; o.vy = 0; r.bottom = true; break; } }
  else if (o.vy < 0) { const ty = Math.floor(o.y / T);
    for (let tx = x0; tx <= x1; tx++) if (solidAt(tx, ty)) r.headTiles.push(tx);
    if (r.headTiles.length) { r.top = true; r.headRow = ty; o.y = (ty + 1) * T; o.vy = 0; } }
  return r;
}

// ---------------------------------------------------------------- game events
function addScore(n, x, y, label) {
  G.score += n;
  G.parts.push({ type: 'text', text: label || String(n), x, y, vy: -1.3, life: 50 });
}
function collectCard(x, y) {
  G.cards++; G.totalCards++; G.score += 200; sfx.card();
  if (G.cards >= 100) { G.cards -= 100; G.lives++; sfx.oneup(); G.parts.push({ type: 'text', text: '1UP', x, y, vy: -1.3, life: 60 }); }
}
function flipEnemy(e, dir) { e.state = 'flip'; e.vy = -7; e.vx = dir * 1.6; }
function hitBlock(tx, ty) {
  const L = G.lvl, t = L.grid[ty][tx], p = G.player;
  if (t === 3) {
    L.grid[ty][tx] = 5; bump(tx, ty);
    G.ents.push({ kind: 'popcard', x: tx * T + 4, y: ty * T - 24, w: 28, h: 20, vy: -10, active: true });
    collectCard(tx * T, ty * T - 30);
  } else if (t === 4) {
    L.grid[ty][tx] = 5; bump(tx, ty); sfx.bump(); sfx.sprout();
    G.ents.push({ kind: 'soda', x: tx * T + 4, y: ty * T, w: 28, h: 30, vx: 0, vy: 0, emerge: 30, active: true });
  } else if (t === 2) {
    if (p.big) {
      L.grid[ty][tx] = 0; bumpAbove(tx, ty); G.score += 50; sfx.brk();
      for (let i = 0; i < 4; i++) G.parts.push({ type: 'debris', x: tx * T + (i % 2) * 18 + 9, y: ty * T + (i < 2 ? 9 : 27),
        vx: (i % 2 ? 1 : -1) * (2 + Math.random()), vy: i < 2 ? -9 : -6, life: 90, rot: 0 });
    } else { bump(tx, ty); sfx.bump(); }
  } else sfx.bump();
}
function bump(tx, ty) { G.bumps.push({ tx, ty, t: 0 }); bumpAbove(tx, ty); }
function bumpAbove(tx, ty) {
  const r = { x: tx * T - 2, y: (ty - 1) * T, w: T + 4, h: T + 2 };
  for (const e of G.ents) {
    if (e.dead || !overlap(e, r)) continue;
    if (isEnemy(e) && ENEMY_LIVE.includes(e.state)) { flipEnemy(e, e.x + e.w / 2 < tx * T + T / 2 ? -1 : 1); addScore(100, e.x, e.y); sfx.kick(); }
    else if (e.kind === 'soda' && !e.emerge) e.vy = -7;
    else if (e.kind === 'card') { e.dead = true; collectCard(e.x, e.y); }
  }
}
function grow() {
  const p = G.player;
  if (!p.big) { p.big = true; p.y -= 30; p.h = 62; G.freeze = 45; G.growT = 45; }
  addScore(1000, p.x, p.y); sfx.power();
}
function hurt() {
  const p = G.player;
  if (p.inv > 0 || G.growT > 0) return;
  if (p.big) { p.big = false; p.y += 30; p.h = 32; p.inv = 120; G.freeze = 25; G.growT = -25; sfx.hurt(); }
  else die();
}
function die() {
  const p = G.player;
  if (G.state !== 'play') return;
  G.state = 'dying'; G.timer = 0; p.dead = true; G.carryBig = false;
  if (p.big) { p.big = false; p.y += 30; p.h = 32; }
  music.stop(); sfx.die();
}
function startFlag() {
  const p = G.player, L = G.lvl;
  G.state = 'flag'; G.fl = { phase: 'slide', t: 0 }; music.stop(); sfx.flag();
  const poleX = L.flagX * T + T / 2;
  p.x = poleX - p.w + 3; p.vx = 0; p.vy = 0; p.facing = 1;
  const hgt = 13 * T - (p.y + p.h);
  const bonus = hgt > 8 * T ? 5000 : hgt > 6 * T ? 2000 : hgt > 4 * T ? 800 : hgt > 2 * T ? 400 : 100;
  addScore(bonus, poleX + 10, p.y);
  G.carryBig = p.big;
}

// ---------------------------------------------------------------- update
function update() {
  G.frame++;
  if (hit('KeyM')) { audio.muted = !audio.muted; if (audio.muted) music.stop(); else if (G.state === 'play' && !G.paused) music.start(SONGS[G.levelIdx]); }
  switch (G.state) {
    case 'device': updateDevice(); break;
    case 'title': updateTitle(); break;
    case 'intro': if (++G.timer > 150) { G.state = 'play'; if (!audio.muted) music.start(SONGS[G.levelIdx]); } break;
    case 'play':
      if (hit('KeyP', 'Escape')) { G.paused = !G.paused; sfx.pause(); if (G.paused) music.stop(); else if (!audio.muted) music.start(SONGS[G.levelIdx]); }
      if (!G.paused) updatePlay();
      break;
    case 'dying': updateDying(); break;
    case 'flag': updateFlag(); break;
    case 'gameover': if (++G.timer > 260 || (G.timer > 60 && hit('Enter', 'Space', 'TouchJump'))) G.state = 'title'; break;
    case 'win': updateWin(); break;
  }
  for (const k in pressed) delete pressed[k];
}

function updateDevice() {
  if (hit('ArrowLeft', 'KeyA', 'ArrowRight', 'KeyD')) { G.devSel ^= 1; sfx.tick(); }
  if (hit('Enter', 'Space')) chooseDevice(G.devSel === 1);
}
function chooseDevice(mobile) {
  G.mobile = mobile; G.devSel = +mobile; G.state = 'title';
  localStorage.setItem('szb_dev', mobile ? 'mobile' : 'desktop');
  document.body.classList.toggle('mobile', mobile);
  sfx.card();
  if (mobile) {   // best effort: fullscreen + landscape (ignored where unsupported, e.g. iPhone Safari)
    const el = document.documentElement, fs = el.requestFullscreen || el.webkitRequestFullscreen;
    if (fs && !document.fullscreenElement) {
      try { Promise.resolve(fs.call(el)).then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape')).catch(() => {}); } catch (e) {}
    }
  } else cv.focus();
}

function updateTitle() {
  const n = CHARS.length;
  if (hit('ArrowLeft', 'KeyA', 'TouchLeft')) { G.sel = (G.sel + n - 1) % n; sfx.tick(); }
  if (hit('ArrowRight', 'KeyD', 'TouchRight')) { G.sel = (G.sel + 1) % n; sfx.tick(); }
  if (hit('Enter', 'Space', 'TouchJump')) { sfx.card(); startGame(); }
  if (hit('Escape', 'Backspace')) { G.state = 'device'; sfx.tick(); }
}

function updatePlay() {
  const p = G.player, c = CHARS[G.charIdx], L = G.lvl;
  if (G.growT > 0) G.growT--; else if (G.growT < 0) G.growT++;
  if (G.freeze > 0) { G.freeze--; return; }

  G.timeAcc += 1 / 60;
  if (G.timeAcc >= 1) { G.timeAcc -= 1; G.time--; if (G.time <= 0) { G.time = 0; die(); return; } }

  for (const e of G.ents) if (e.kind === 'plat') {
    let nx = e.x + e.v; if (nx < e.a || nx > e.b) { e.v = -e.v; nx = e.x + e.v; }
    e.dx = nx - e.x; e.x = nx;
  }

  // --- player input
  const dir = (K.right() ? 1 : 0) - (K.left() ? 1 : 0);
  const maxV = K.run() ? c.run : c.walk;
  if (dir) {
    const turning = Math.sign(p.vx) === -dir && Math.abs(p.vx) > 0.5;
    p.vx += dir * (p.onGround ? (turning ? 0.45 : 0.2) : 0.16);
    if (Math.abs(p.vx) > maxV) p.vx = Math.sign(p.vx) * Math.max(maxV, Math.abs(p.vx) - 0.2);
    p.facing = dir;
  } else if (p.onGround) { p.vx *= 0.84; if (Math.abs(p.vx) < 0.1) p.vx = 0; }
  else p.vx *= 0.985;

  if (JUMP_KEYS.some(k => pressed[k])) p.jumpBuf = 7; else if (p.jumpBuf > 0) p.jumpBuf--;
  if (p.onGround) p.coyote = 6; else if (p.coyote > 0) p.coyote--;
  if (p.jumpBuf > 0 && p.coyote > 0) {
    p.vy = -(c.jump + Math.abs(p.vx) * 0.22); p.onGround = false; p.coyote = 0; p.jumpBuf = 0; p.riding = null; sfx.jump();
  }
  p.vy = Math.min(p.vy + ((p.vy < 0 && K.jump()) ? 0.5 : 1.1), 13);

  if (p.riding) { p.x += p.riding.dx; p.y = p.riding.y - p.h; }
  p.prevBottom = p.y + p.h;
  const r = moveEntity(p);
  if (r.left || r.right) p.vx = 0;
  if (r.top) {
    let best = r.headTiles[0], bd = 1e9; const pc = p.x + p.w / 2;
    for (const tx of r.headTiles) { const d = Math.abs(tx * T + T / 2 - pc); if (d < bd) { bd = d; best = tx; } }
    hitBlock(best, r.headRow);
  }
  p.onGround = r.bottom; p.riding = null;
  if (!p.onGround && p.vy >= 0) for (const e of G.ents) if (e.kind === 'plat') {
    if (p.x + p.w > e.x + 2 && p.x < e.x + e.w - 2 && p.prevBottom <= e.y + 2 && p.y + p.h >= e.y) {
      p.y = e.y - p.h; p.vy = 0; p.onGround = true; p.riding = e;
    }
  }
  if (p.onGround) { p.combo = 0; p.phase += Math.abs(p.vx) * 0.09; }
  if (p.inv > 0) p.inv--;
  if (p.y > H + 60) { die(); return; }

  updateEnemies();
  updateItems();

  for (const b of G.bumps) b.t++;
  G.bumps = G.bumps.filter(b => b.t <= 10);
  G.ents = G.ents.filter(e => !e.dead);

  G.camX = clamp(p.x + p.w / 2 - W * 0.42, 0, L.w * T - W);
  if (p.x > L.mid * T) G.checkpoint = true;
  if (G.state === 'play' && p.x + p.w >= L.flagX * T + T / 2 - 2) startFlag();
  updateParticles();
}

function updateEnemies() {
  const p = G.player;
  for (const e of G.ents) {
    if (!isEnemy(e)) continue;
    if (!e.active) { if (e.x < G.camX + W + T * 2) e.active = true; else continue; }
    if (e.state === 'walk' || e.state === 'slide') {
      e.vy = Math.min(e.vy + 0.8, 12); const vx = e.vx; const r = moveEntity(e);
      e.vx = (r.left || r.right) ? -vx : vx;
      if ((r.left || r.right) && e.state === 'slide' && Math.abs(e.x - p.x) < W) sfx.bump();
      e.phase += 0.15; if (e.grace > 0) e.grace--;
    } else if (e.state === 'shell') {
      e.vy = Math.min(e.vy + 0.8, 12); e.vx = 0; moveEntity(e);
      if (++e.t > 420) { e.state = 'walk'; e.y -= 16; e.h = 40; e.vx = p.x < e.x ? -0.9 : 0.9; }
    } else if (e.state === 'squash') { if (--e.t <= 0) e.dead = true; }
    else if (e.state === 'flip') { e.vy += 0.5; e.x += e.vx; e.y += e.vy; }
    if (e.y > H + 80) e.dead = true;
  }
  // enemy vs enemy
  const en = G.ents.filter(e => isEnemy(e) && e.active && !e.dead && ENEMY_LIVE.includes(e.state));
  for (let i = 0; i < en.length; i++) for (let j = i + 1; j < en.length; j++) {
    const a = en[i], b = en[j];
    if (!ENEMY_LIVE.includes(a.state) || !ENEMY_LIVE.includes(b.state) || !overlap(a, b)) continue;
    if (a.state === 'slide' || b.state === 'slide') {
      for (const [s, o] of [[a, b], [b, a]]) if (s.state === 'slide' && o.state !== 'flip') { flipEnemy(o, Math.sign(s.vx) || 1); addScore(200, o.x, o.y); sfx.kick(); }
    } else if (a.state === 'walk' && b.state === 'walk') {
      if (a.x < b.x) { a.vx = -Math.abs(a.vx); b.vx = Math.abs(b.vx); } else { a.vx = Math.abs(a.vx); b.vx = -Math.abs(b.vx); }
    } else {
      const w = a.state === 'walk' ? a : b.state === 'walk' ? b : null, s = w === a ? b : a;
      if (w) w.vx = w.x < s.x ? -Math.abs(w.vx) : Math.abs(w.vx);
    }
  }
  // player vs enemy
  if (G.state !== 'play') return;
  for (const e of en) {
    if (!ENEMY_LIVE.includes(e.state) || !overlap(p, e, 3)) continue;
    const stomp = p.vy > 0 && p.prevBottom <= e.y + 10;
    const bounce = () => { p.vy = K.jump() ? -12 : -7.5; p.combo++; addScore(100 * Math.pow(2, Math.min(p.combo - 1, 6)), e.x, e.y); sfx.stomp(); };
    if (e.state === 'walk') {
      if (stomp) {
        if (e.kind === 'book') { e.state = 'squash'; e.t = 30; }
        else { e.state = 'shell'; e.y += 16; e.h = 24; e.vx = 0; e.t = 0; }
        bounce();
      } else hurt();
    } else if (e.state === 'shell') {
      e.state = 'slide'; e.vx = (p.x + p.w / 2 < e.x + e.w / 2 ? 1 : -1) * 7.5; e.grace = 12; e.t = 0;
      sfx.kick(); addScore(400, e.x, e.y);
      if (stomp) p.vy = -7.5;
    } else if (e.state === 'slide') {
      if (stomp) { e.state = 'shell'; e.vx = 0; e.t = 0; bounce(); }
      else if (e.grace <= 0) hurt();
    }
    if (G.state !== 'play') return;
  }
}

function updateItems() {
  const p = G.player;
  for (const e of G.ents) {
    if (e.kind === 'soda') {
      if (e.emerge > 0) { e.y -= 1; if (--e.emerge === 0) e.vx = 2; continue; }
      e.vy = Math.min(e.vy + 0.6, 10); const vx = e.vx; const r = moveEntity(e);
      e.vx = (r.left || r.right) ? -vx : vx;
      if (e.y > H + 50) e.dead = true;
      if (overlap(p, e)) { e.dead = true; grow(); }
    } else if (e.kind === 'popcard') {
      e.y += e.vy; e.vy += 0.7; if (e.vy > 6) { e.dead = true; G.parts.push({ type: 'text', text: '200', x: e.x, y: e.y, vy: -1.3, life: 40 }); }
    } else if (e.kind === 'card') {
      if (overlap(p, e, 2)) { e.dead = true; collectCard(e.x, e.y); }
    }
  }
}

function updateParticles() {
  for (const q of G.parts) {
    q.life--;
    if (q.type === 'debris') { q.vy += 0.5; q.x += q.vx; q.y += q.vy; q.rot += 0.3; }
    else if (q.type === 'spark') { q.vy += 0.05; q.vx *= 0.98; q.x += q.vx; q.y += q.vy; }
    else q.y += q.vy;
  }
  G.parts = G.parts.filter(q => q.life > 0);
}

function updateDying() {
  const p = G.player; G.timer++;
  if (G.timer === 30) p.vy = -13;
  if (G.timer > 30) { p.vy += 0.7; p.y += p.vy; }
  updateParticles();
  if (G.timer > 210) {
    G.lives--;
    if (G.lives <= 0) { G.state = 'gameover'; G.timer = 0; saveHi(); }
    else startIntro();
  }
}

function updateFlag() {
  const p = G.player, L = G.lvl, f = G.fl; f.t++;
  if (f.phase === 'slide') {
    p.y = Math.min(p.y + 5, 13 * T - p.h);
    G.flagY = Math.min(G.flagY + 5, 12 * T - 36);
    if (p.y + p.h >= 13 * T && G.flagY >= 12 * T - 36) { f.phase = 'walk'; f.t = 0; sfx.clear(); }
  } else if (f.phase === 'walk') {
    if (f.t > 15) {
      p.vx = 2.4; p.vy = Math.min(p.vy + 1.1, 13);
      const r = moveEntity(p); p.onGround = r.bottom; if (p.onGround) p.phase += 0.22;
      if (p.x + p.w / 2 >= (L.castleX + 2.5) * T) { p.hidden = true; f.phase = 'tally'; f.t = 0; }
      G.camX = clamp(p.x + p.w / 2 - W * 0.42, 0, L.w * T - W);
    }
  } else if (f.phase === 'tally') {
    if (G.time > 0) { const d = Math.min(G.time, 3); G.time -= d; G.score += d * 50; if (f.t % 3 === 0) sfx.tick(); f.t2 = 0; }
    else if (++f.t2 > 100) {
      if (G.levelIdx < LEVELS.length - 1) { G.levelIdx++; G.checkpoint = false; startIntro(); }
      else { G.state = 'win'; G.timer = 0; G.parts = []; saveHi(); sfx.oneup(); }
    }
  }
  updateParticles();
}

function updateWin() {
  G.timer++;
  if (G.timer % 25 === 0) {
    const x = 100 + Math.random() * (W - 200), y = 80 + Math.random() * 200;
    const col = ['#ffd54f', '#4fc3f7', '#ffffff', '#ef5350', '#81c784'][Math.floor(Math.random() * 5)];
    for (let i = 0; i < 40; i++) { const a = i / 40 * Math.PI * 2, s = 2 + Math.random() * 2.5;
      G.parts.push({ type: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 60 + Math.random() * 20, col }); }
    if (G.timer % 50 === 0) audio.tone(120 + Math.random() * 80, 0.3, 'sawtooth', 0.12, 40);
  }
  updateParticles();

function drawHead(c, hr, hcy, big, facing) {

  ctx.fillStyle = shade(c.skin, -0.32); ellipse(-hr * 0.3, hcy + hr * 0.17, hr * 0.08 * eb, hr * 0.14 * eb);

  for (const x of ex) line(x - 2.2, ey - (big ? 4.2 : 3.2), x + 2.2, ey - (big ? 4.6 : 3.5));

  ctx.fillStyle = skinD;

  else ellipse(hr * 0.96, hcy + hr * 0.2, hr * 0.14, hr * 0.18);

    ctx.quadraticCurveTo(hr * 0.5, hcy + hr * 0.6, hr * 0.15, hcy + hr * 0.3); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#bdbdbd'; ctx.lineWidth = 0.8; ctx.stroke();
    ctx.fillStyle = '#f7f7f7'; ellipse(hr * 0.62, hcy + hr * 0.45, hr * 0.34, hr * 0.13);
  } else {
    ctx.strokeStyle = '#3a1d10'; ctx.lineWidth = big ? 1.3 : 1;

  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

function drawBuilding(b, x, base, th, theme) {
  const r = rng(b.seed), w = b.w, h = b.h;
  ctx.fillStyle = th.far;
  const win = () => theme === 'night' ? (r() < 0.4 ? '#ffd36b' : th.farWin) : th.farWin;

    ctx.fillRect(x, base - h, w, h);
    const s2w = w * 0.7, s2h = h * 0.2, s2x = x + (w - s2w) / 2;
    ctx.fillRect(s2x, base - h - s2h, s2w, s2h);

    tri(s2x - 2, base - h - s2h + 2, 7, 18); tri(s2x + s2w - 5, base - h - s2h + 2, 7, 18);
    tri(s2x + s2w * 0.2, base - h - s2h, s2w * 0.6, h * 0.25);
    for (let i = 0; i < 3; i++) arch(x + w / 2 - 4, base - h + 20 + i * 45, 8, 26);
    arch(s2x + s2w / 2 - 4, base - h - s2h + 10, 8, 18);
  } else if (b.type === 'hall') {

    ctx.beginPath(); ctx.moveTo(x - 4, base - h); ctx.lineTo(x + w * 0.12, base - h - 30); ctx.lineTo(x + w * 0.88, base - h - 30); ctx.lineTo(x + w + 4, base - h); ctx.fill();
    for (let i = 0; i < 4; i++) tri(x + w * (0.15 + i * 0.22), base - h - 28, 16, 16);
    const cols = Math.floor(w / 26), rows = Math.floor(h / 40);
    for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) arch(x + 10 + i * 26, base - h + 14 + j * 40, 10, 22);
  } else {

      ctx.fillStyle = '#6b3d00'; for (const [a, b] of [[5, 5], [T - 8, 5], [5, T - 8], [T - 8, T - 8]]) ctx.fillRect(x + a, y + b, 3, 3);
      ctx.font = `18px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#6b3d00'; ctx.fillText('?', x + T / 2 + 2, y + T / 2 + 3); ctx.fillStyle = '#fff4cf'; ctx.fillText('?', x + T / 2, y + T / 2 + 1);
      break; }
    case 5: {
      ctx.fillStyle = '#4e2f12'; ctx.fillRect(x, y, T, T); ctx.fillStyle = '#9a6a3a'; ctx.fillRect(x + 2, y + 2, T - 4, T - 4);
      ctx.fillStyle = '#4e2f12'; for (const [a, b] of [[5, 5], [T - 8, 5], [5, T - 8], [T - 8, T - 8]]) ctx.fillRect(x + a, y + b, 3, 3);
      break; }
    case 6: {

      ctx.fillStyle = th.hard; ctx.fillRect(x + 4, y + 4, T - 8, T - 8);
      break; }
    case 7: {
      const pw = 2 * T - 8, px = x + 4;
      const g = ctx.createLinearGradient(px, 0, px + pw, 0);
      g.addColorStop(0, '#00244a'); g.addColorStop(0.25, '#3f7fc8'); g.addColorStop(0.45, '#0f4f96'); g.addColorStop(1, '#001a36');
      ctx.fillStyle = g; ctx.fillRect(px, y, pw, T);
      ctx.fillStyle = '#001226'; ctx.fillRect(px, y, 2, T); ctx.fillRect(px + pw - 2, y, 2, T);
      if (pipeTop) {

}

function drawTiles(cam) {
  const L = G.lvl, th = THEMES[L.theme];
  const x0 = Math.max(0, Math.floor(cam / T) - 1), x1 = Math.min(L.w - 1, Math.floor(cam / T) + Math.ceil(W / T) + 1);
  const bm = {}; for (const b of G.bumps) bm[b.tx + ',' + b.ty] = -Math.sin(b.t / 10 * Math.PI) * 9;
  for (let ty = 0; ty < ROWS; ty++) for (let tx = x0; tx <= x1; tx++) {
    const t = L.grid[ty][tx]; if (!t || t === 8) continue;
    const above = ty > 0 ? L.grid[ty - 1][tx] : 0;
    drawTile(t, Math.round(tx * T - cam), ty * T + (bm[tx + ',' + ty] || 0), th, tx, ty, above !== 1, above !== 7);
  }
}

function drawGoal(cam) {
  const L = G.lvl, th = THEMES[L.theme], base = 13 * T;
  // pole + Yale flag
  const px = L.flagX * T + T / 2 - cam;
  if (px > -100 && px < W + 100) {
    ctx.fillStyle = '#5d6a78'; ctx.fillRect(px - 8, base - 10, 16, 10);
    ctx.fillStyle = '#e1e6ec'; ctx.fillRect(px - 2, 2 * T, 4, base - 2 * T - 10);
    ctx.fillStyle = '#ffd54f'; circle(px, 2 * T - 5, 7);
    const fy = G.flagY;
    ctx.fillStyle = '#00356b'; ctx.beginPath(); ctx.moveTo(px - 2, fy); ctx.lineTo(px - 50, fy + 4); ctx.lineTo(px - 50, fy + 30); ctx.lineTo(px - 2, fy + 34); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 22px Georgia'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('Y', px - 26, fy + 18);
  }
  // goal building
  const cx = L.castleX * T - cam;
  if (cx > W + 50 || cx + 5 * T < -50) return;
  ctx.fillStyle = th.stone; ctx.fillRect(cx, base - 4 * T, 5 * T, 4 * T);
  ctx.fillRect(cx + 1.5 * T, base - 6.5 * T, 2 * T, 2.5 * T);
  for (let i = 0; i < 8; i++) ctx.fillRect(cx + i * 24, base - 4 * T - 10, 14, 10);
  for (let i = 0; i < 3; i++) ctx.fillRect(cx + 1.5 * T + i * 26, base - 6.5 * T - 10, 16, 10);
  ctx.fillStyle = th.stoneDark;
  for (let j = 1; j < 8; j++) ctx.fillRect(cx, base - j * 18, 5 * T, 1.5);
  for (let j = 0; j < 8; j++) for (let i = 0; i < 5; i++) ctx.fillRect(cx + i * 36 + (j % 2) * 18, base - (j + 1) * 18, 1.5, 18);
  ctx.fillStyle = '#1b1208'; ctx.beginPath(); ctx.moveTo(cx + 2 * T, base); ctx.lineTo(cx + 2 * T, base - 1.3 * T);
  ctx.arc(cx + 2.5 * T, base - 1.3 * T, 0.5 * T, Math.PI, 0); ctx.lineTo(cx + 3 * T, base); ctx.closePath(); ctx.fill();
  const winC = L.theme === 'night' ? '#ffd36b' : '#2a3d5c';
  ctx.fillStyle = winC;
  for (const wx of [cx + 0.5 * T, cx + 4 * T]) { ctx.fillRect(wx, base - 3 * T, 16, 26); ctx.beginPath(); ctx.arc(wx + 8, base - 3 * T, 8, Math.PI, 0); ctx.fill(); }
  ctx.fillRect(cx + 2.5 * T - 8, base - 5.6 * T, 16, 26); ctx.beginPath(); ctx.arc(cx + 2.5 * T, base - 5.6 * T, 8, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#00356b'; ctx.fillRect(cx + 1.1 * T, base - 2.55 * T, 2.8 * T, 22);
  ctx.strokeStyle = '#ffd54f'; ctx.lineWidth = 1.5; ctx.strokeRect(cx + 1.1 * T, base - 2.55 * T, 2.8 * T, 22);
  ctx.font = `8px ${FONT}`; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(L.sign, cx + 2.5 * T, base - 2.55 * T + 11);
  ctx.fillStyle = '#e1e6ec'; ctx.fillRect(cx + 2.5 * T - 1, base - 6.5 * T - 44, 2, 34);
  ctx.fillStyle = '#00356b'; ctx.beginPath(); const wv = Math.sin(G.frame * 0.1) * 3;
  ctx.moveTo(cx + 2.5 * T + 1, base - 6.5 * T - 44); ctx.lineTo(cx + 2.5 * T + 24, base - 6.5 * T - 38 + wv); ctx.lineTo(cx + 2.5 * T + 1, base - 6.5 * T - 30); ctx.fill();
}

function drawWorld() {
  const L = G.lvl, cam = Math.round(G.camX), p = G.player;
  drawBackground(L.theme, G.bg, cam);
  for (const e of G.ents) if (e.kind === 'soda' && e.emerge > 0) drawSoda(e.x - cam, e.y);
  drawGoal(cam);
  drawTiles(cam);
  for (const e of G.ents) {
    const x = e.x - cam; if (x < -80 || x > W + 80) continue;
    if (e.kind === 'plat') {
      ctx.fillStyle = '#5a3b22'; ctx.fillRect(x, e.y, e.w, e.h); ctx.fillStyle = '#8b5e3c'; ctx.fillRect(x, e.y, e.w, 4);
      const bc = ['#b3261e', '#1565c0', '#2e7d32', '#ef6c00', '#6a1b9a', '#00695c'];
      for (let i = 0; i < e.w / 9 - 1; i++) { ctx.fillStyle = bc[i % bc.length]; ctx.fillRect(x + 3 + i * 9, e.y - 12 + (i % 3), 7, 12 - (i % 3)); }
    } else if (e.kind === 'card') drawIdCard(x + 14, e.y + 10, G.frame * 0.07 + e.x * 0.01);
    else if (e.kind === 'popcard') drawIdCard(x + 14, e.y + 10, G.frame * 0.4);
    else if (e.kind === 'soda' && !e.emerge) drawSoda(x, e.y);
    else if (isEnemy(e)) drawBook(e, cam);
  }
  if (!p.hidden && !(p.inv > 0 && Math.floor(p.inv / 3) % 2)) {
    let big = p.big;
    if (G.growT !== 0) { const t = Math.abs(G.growT); if (Math.floor(t / 5) % 2) big = !big; }
    const air = !p.onGround || p.dead || (G.fl && G.fl.phase === 'slide');
    drawChar(G.charIdx, p.x + p.w / 2 - cam, p.y + p.h, big, p.dead ? 1 : p.facing, p.phase, air);
  }
  for (const q of G.parts) {
    if (q.type === 'debris') {
      ctx.save(); ctx.translate(q.x - cam, q.y); ctx.rotate(q.rot); ctx.fillStyle = THEMES[L.theme].brick; ctx.fillRect(-6, -6, 12, 12);
      ctx.fillStyle = THEMES[L.theme].brickLine; ctx.fillRect(-6, 0, 12, 1.5); ctx.restore();
    } else if (q.type === 'text') text(q.text, q.x - cam + 14, q.y, 10, '#fff', 'center');
  }
}

cv.addEventListener('click', e => {
  audio.unlock();
  const r = cv.getBoundingClientRect(), mx = (e.clientX - r.left) * W / r.width, my = (e.clientY - r.top) * H / r.height;
  if (G.state === 'device') {
    for (let i = 0; i < 2; i++) if (inRect(mx, my, DEV_BOX(i))) chooseDevice(i === 1);
    return;
  }
  if (!G.mobile) cv.focus();
  if (G.state === 'title') {
    if (inRect(mx, my, BACK_BTN)) { G.state = 'device'; sfx.tick(); return; }
    for (let i = 0; i < CHARS.length; i++)
      if (inRect(mx, my, PANEL(i))) { if (G.sel === i) { sfx.card(); startGame(); } else { G.sel = i; sfx.tick(); } }
  } else if (G.state === 'play') {
    if (G.paused) {
      if (inRect(mx, my, PAUSE_MENU[1])) { pressed.KeyM = true; }
      else pressed.KeyP = true;                       // tap anywhere else resumes
    } else if (G.mobile && inRect(mx, my, { x: PAUSE_BTN.x - 10, y: 0, w: PAUSE_BTN.w + 20, h: PAUSE_BTN.h + 20 })) pressed.KeyP = true;
  } else if (G.state === 'gameover' || G.state === 'win') pressed.Enter = true;
});

    const r = stick.getBoundingClientRect(), R = r.width / 2;
    let dx = e.clientX - (r.left + R), dy = e.clientY - (r.top + R);
    const d = Math.hypot(dx, dy); if (d > R) { dx *= R / d; dy *= R / d; }
    knob.style.transform = `translate(${dx}px,${dy}px)`;
    const nx = dx / R;
    setVKey('TouchLeft', nx < -0.3); setVKey('TouchRight', nx > 0.3); setVKey('TouchDash', Math.abs(nx) > 0.85);
  };
  const end = e => {
    if (e.pointerId !== stickId) return;
    stickId = null; knob.style.transform = '';
    setVKey('TouchLeft', false); setVKey('TouchRight', false); setVKey('TouchDash', false);
  };
  stick.addEventListener('pointerdown', e => { e.preventDefault(); audio.unlock(); stickId = e.pointerId; try { stick.setPointerCapture(e.pointerId); } catch (_) {} move(e); });
  stick.addEventListener('pointermove', e => { if (e.pointerId === stickId) move(e); });
  for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) stick.addEventListener(ev, end);
  for (const [id, code] of [['btnJump', 'TouchJump'], ['btnRun', 'TouchRun']]) {
    const b = document.getElementById(id); let pid = null;
    b.addEventListener('pointerdown', e => { e.preventDefault(); audio.unlock(); pid = e.pointerId; try { b.setPointerCapture(e.pointerId); } catch (_) {} setVKey(code, true); b.classList.add('on'); });
    const up = e => { if (e.pointerId !== pid) return; pid = null; setVKey(code, false); b.classList.remove('on'); };
    for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) b.addEventListener(ev, up);
  }
  document.getElementById('touch').addEventListener('contextmenu', e => e.preventDefault());
  // Pause automatically if the player switches apps mid-level
  document.addEventListener('visibilitychange', () => { if (document.hidden && G.state === 'play' && !G.paused) { G.paused = true; music.stop(); } });
})();

// ---------------------------------------------------------------- main loop
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  draw();
  requestAnimationFrame(loop);
}
cv.focus();
requestAnimationFrame(loop);
</script>
</body>
</html>
